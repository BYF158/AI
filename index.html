<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEBULA · 星云画廊</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scanlines"></div>
<div class="grid-bg"></div>
<div class="aurora"></div>

<header class="hero">
  <h1 class="glitch" data-text="NEBULA ▸ 星云画廊">NEBULA ▸ 星云画廊</h1>
  <p class="sub">AUTO SCROLL GALLERY · v5.0.0</p>
  <p class="hint">◈ 图片自动巡游 · 悬停可暂停 ◈</p>
</header>

<main>
  <!-- 自动横向滚动走廊 -->
  <div class="carousel-wrap">
    <div class="carousel-track" id="track">
      <!-- 卡片由 JS 注入 -->
    </div>
    <div class="carousel-edge left"></div>
    <div class="carousel-edge right"></div>
  </div>
</main>

<!-- 右下角悬浮添加按钮 -->
<button id="fab" class="fab" title="添加图片" aria-label="添加图片">
  <span class="fab-plus">＋</span>
  <span class="fab-label">上传</span>
</button>

<!-- 上传弹窗 -->
<div id="upload-modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h2>▸ 添加图片到云端</h2>
      <button id="modal-close" class="modal-close" title="关闭">×</button>
    </div>
    <div id="drop-zone" class="drop-zone">
      <div class="dz-inner">
        <div class="dz-icon">⬆</div>
        <p class="dz-main">拖拽图片到此处 / 点击选择</p>
        <p class="dz-sub">上传至云端 · PNG / JPG / GIF / WebP</p>
        <input type="file" id="file-input" accept="image/*" multiple hidden>
      </div>
      <p id="upload-status" class="upload-status"></p>
    </div>
  </div>
</div>

<!-- 灯箱预览 -->
<div id="lightbox" class="lightbox" hidden>
  <img id="lightbox-img" alt="">
  <button id="lightbox-close" class="lb-close">×</button>
</div>

<script src="app.js"></script>
</body>
</html>
